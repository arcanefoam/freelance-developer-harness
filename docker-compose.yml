services:
  azure-opencode:
    build: .
    container_name: az-devops-opencode
    volumes:
      # Persists your 'az login' credentials on your host machine
      - ~/.azure:/root/.azure
      # Mounts your current directory to access local scripts or templates
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true